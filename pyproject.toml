[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-continuous-trader"
version = "1.0.0"
description = "Causal multitimeframe SMC observation, belief, decision, and risk engine"
requires-python = ">=3.10"
dependencies = [
  # numpy 2.5 deprecated the unitless ("generic") timedelta64, and pandas 2.3.3 —
  # the newest pandas 2.x — still builds one inside Timedelta.__new__, so every
  # pd.Timedelta(minutes=...) call raises a DeprecationWarning attributed to the
  # caller. Lift this ceiling once a pandas release stops constructing it.
  "numpy>=1.24,<2.5",
  "pandas>=2.0,<3.0",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "exchange-calendars==4.11",
  "psutil>=5.9",
  # brain/core is a runtime consumer of both, not just a research one:
  # hypothesis_proposer clusters each clock's conditional cloud with
  # sklearn.cluster.KMeans, and hypothesis_pool matches nodes to live
  # hypotheses with scipy.optimize.linear_sum_assignment. scikit-learn 1.3
  # brought HDBSCAN into the main package, so no separate hdbscan dependency
  # is needed.
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dbn = ["databento>=0.64"]
representation = ["torch>=2.2,<3"]
# The predictability gate's tree model. Research only; nothing in brain/core
# imports it.
research = ["lightgbm>=4.3"]

[tool.setuptools.packages.find]
include = ["eyes*", "brain*", "execution*", "shares*", "contract*"]

[tool.pytest.ini_options]
testpaths = ["eyes/tests", "brain/tests", "execution/tests", "shares/tests"]
addopts = "-q -m 'not research_orchestration'"
markers = [
  "research_orchestration: bounded study-orchestration tests run separately from daily model tests; currently only the Eye authority-scan group",
]
