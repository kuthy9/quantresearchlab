  "concepts": {
    "confirmed_swing": {
      "owner": "eye",
      "domain_meaning": "A local price turning point and atomic node of the structure tree.",
      "operational_definition": "A high/low pivot must dominate the frozen left and right windows and is emitted only after the right window completes. Prominence remains continuous with no positive hard threshold. At confirmation the immutable pivot receives the MICRO base role. Append-only same-timeframe assignments promote exact leg endpoints to INTERNAL, exact STRUCTURE_DIRECTION_CONFIRMED source swings to STRUCTURAL, and the exact PROTECTED_SWING_ASSIGNED swing to EXTERNAL. Each assignment retains its known_at and source event identities; later roles never rewrite or backdate the confirmed swing.",
      "hypothesized_relations": [
        "higher prominence may increase later reaction",
        "higher prominence may increase liquidity crossing or structural use"
      ],
      "falsification_conditions": [
        "small nearby parameter changes produce unrelated structures",
        "high-prominence pivots do not differ from matched local extrema"
      ],
      "oos_pass_criteria": [
        "exact causal replay",
        "directionally consistent structure across regimes",
        "a stable parameter plateau rather than a single optimum"
      ],
      "existing_binding": "smc_trader.structure.StructureTracker / SwingPoint emits the immutable MICRO SWING_CONFIRMED atom; smc_trader.market_state.SwingHierarchyView appends later INTERNAL, STRUCTURAL, and EXTERNAL assignments from existing canonical events"
    },
    "structural_leg": {
      "owner": "eye",
      "domain_meaning": "The complete price movement between opposite confirmed swings.",
      "operational_definition": "Create a leg from one confirmed swing to the next opposite confirmed swing and retain direction, amplitude, duration, retracement, travel, and efficiency = abs(close_end-close_start)/sum(abs(delta_close)). Creation-time rank depends only on the frozen path length available at leg known_at (MICRO for a two-bar path, otherwise INTERNAL); later BOS or protection authority is represented by append-only swing-role assignments and never backfilled into the historical leg.",
      "hypothesized_relations": [
        "efficient legs may precede displacement",
        "efficient legs may increase BOS and continuation probability"
      ],
      "falsification_conditions": [
        "leg efficiency and amplitude add no information about the next structural outcome"
      ],
      "oos_pass_criteria": [
        "leg features add stable incremental information for the next structural event"
      ],
      "existing_binding": "smc_trader.market_state.build_structural_legs / StructuralLegState emits STRUCTURAL_LEG_CREATED from exactly two SWING_CONFIRMED parents"
    },
    "candidate_liquidity_level": {
      "owner": "eye",
      "domain_meaning": "An observable price level that may attract orders or become a target; it is not a claim about institutional stops.",
      "operational_definition": "Create candidates only from registered confirmed swings, equal highs/lows, previous completed session/day/week extremes, and frozen dealing-range boundaries. Preserve source kind, source identity, price, side, age, rank, and lifecycle.",
      "hypothesized_relations": [
        "level classes may differ in touch, crossing, rejection, acceptance, and target rates"
      ],
      "falsification_conditions": [
        "registered level classes do not differ from matched pseudo-levels"
      ],
      "oos_pass_criteria": [
        "at least one class has a stable matched touch, reaction, or target effect"
      ],
      "existing_binding": "LiquidityInventoryItem, SupportResistanceState, LiquidityPoolState, and active-range boundary inventory emit LIQUIDITY_LEVEL_CREATED; lifecycle state records remain context transport"
    },
    "liquidity_sweep": {
      "owner": "eye",
      "domain_meaning": "A temporary penetration of a candidate liquidity level followed by return to its prior side.",
      "operational_definition": "First emit LEVEL_TOUCHED and LEVEL_PENETRATED for one frozen level and crossing_generation_id. Emit SWEEP_CONFIRMED only when a registered later completed close returns to the original side within that event family's frozen resolution window. Preserve exact candidate, penetration, and completed-bar ancestry plus crossed_at/resolved_at; versioned research derives maximum penetration, recovery time, and volume features from that ancestry rather than assuming every terminal event carries one common metric vector.",
      "hypothesized_relations": [
        "sweep may precede reversal flow",
        "sweep may increase opposite displacement or MSS probability"
      ],
      "falsification_conditions": [
        "sweeps do not differ from matched touches, wicks, or random crossings"
      ],
      "oos_pass_criteria": [
        "stable incremental structural information after trend, session, and volatility controls"
      ],
      "existing_binding": "the canonical crossing pipeline emits LEVEL_TOUCHED, LEVEL_PENETRATED, and SWEEP_CONFIRMED; ACCEPTANCE_CONFIRMED belongs exclusively to the acceptance concept, while LiquidityPoolState and ManipulationState are context transports"
    },
    "acceptance": {
      "owner": "eye",
      "domain_meaning": "Sustained trading outside a crossed structural level.",
      "operational_definition": "After penetration, confirm acceptance only from the registered count of later completed closes outside the frozen level or registered outside time/volume. Sweep/rejection and acceptance are mutually exclusive terminal resolutions for one crossing generation.",
      "hypothesized_relations": [
        "acceptance may increase same-direction continuation probability"
      ],
      "falsification_conditions": [
        "acceptance does not outperform matched ordinary breaks"
      ],
      "oos_pass_criteria": [
        "incremental continuation information after trend, volatility, and session controls"
      ],
      "existing_binding": "the canonical crossing pipeline emits ACCEPTANCE_CONFIRMED for the same unique crossing_generation_id used by the competing Sweep resolution; BOS_POST_BREAK_STATE, LIQUIDITY_POOL_STATE, and MANIPULATION_STATE are legacy/context transports"
    },
    "displacement": {
      "owner": "eye",
      "domain_meaning": "Fast, efficient, directionally coherent price delivery.",
      "operational_definition": "Emit DISPLACEMENT_OBSERVED for each started, active, exhausted, or censored lifecycle transition with exact admitted completed-bar ancestry and the frozen continuous episode metrics: relative ATR, body fraction, directional close location, efficiency, volume ratio/readiness, directional counts, speed, travel, and overlap. FVG creation remains a separately linked later context fact rather than a displacement-definition field. Lifecycle thresholds are versioned parameters; no isolated ATR threshold defines the concept.",
      "hypothesized_relations": [
        "higher score may increase structural break and continuation probability",
        "higher score may correspond to order-flow imbalance"
      ],
      "falsification_conditions": [
        "features have no monotone structural relationship",
        "effects are confined to one period",
        "MBO shows no corresponding mechanism"
      ],
      "oos_pass_criteria": [
        "monotone and stable structural relationship across periods before MBO mechanism validation"
      ],
      "existing_binding": "CausalDisplacementEye / DisplacementTransitionObservation emits DISPLACEMENT_OBSERVED for all lifecycle transitions; Phase-5 selects evidence.lifecycle == active through a separately frozen research predicate"
    },
    "raw_boundary_break": {
      "owner": "eye",
      "domain_meaning": "A completed-price break of a pre-existing structural boundary without directional qualification.",
      "operational_definition": "Emit when a later same-timeframe completed close exceeds the frozen confirmed boundary plus the registered buffer. Keep target identity, break bar, direction, distance, and acceptance state.",
      "hypothesized_relations": [
        "raw breaks provide the control population for qualified BOS"
      ],
      "falsification_conditions": [
        "registered boundaries do not differ from matched pseudo-boundaries"
      ],
      "oos_pass_criteria": [
        "replay-stable break population suitable for nested and non-nested controls"
      ],
      "existing_binding": "confirmed BreakOfStructureState emits RAW_BOUNDARY_BREAK from the exact target SWING_CONFIRMED and completed break BAR before any directional qualification"
    },
    "structure_direction": {
      "owner": "eye",
      "domain_meaning": "The confirmed same-timeframe structural direction that exists before a boundary break is classified.",
      "operational_definition": "Emit STRUCTURE_DIRECTION_CONFIRMED once for a confirmed same-timeframe structure generation from the exact confirmed high and low swing events knowable at that generation's confirmed_at. Preserve direction, structure identity, formation event_time, confirmation known_at, and source swing identities. Child-timeframe direction never rewrites this parent-timeframe fact.",
      "hypothesized_relations": [
        "same-timeframe confirmed direction may condition continuation after raw breaks",
        "direction may condition protected-swing survival and parent-child relations"
      ],
      "falsification_conditions": [
        "the direction generation cannot be replayed exactly",
        "conditioning on confirmed direction adds no information beyond an unqualified raw break"
      ],
      "oos_pass_criteria": [
        "exact deterministic replay and stable incremental structural information when used to qualify BOS or MSS"
      ],
      "existing_binding": "StructureTracker / StructureSequenceState emits STRUCTURE_DIRECTION_CONFIRMED from the exact high and low SWING_CONFIRMED parents; STRUCTURE_STATE is legacy lifecycle transport"
    },
    "qualified_bos": {
      "owner": "eye",
      "domain_meaning": "A raw boundary break aligned with the current same-timeframe structure direction.",
      "operational_definition": "Qualify a raw break as BOS only from the direction of the same-timeframe confirmed structure that existed at known_at. Displacement and FVG remain context features, not mandatory definition fields.",
      "hypothesized_relations": [
        "BOS may increase continuation, MFE, and protected-swing survival",
        "displacement may add incremental value"
      ],
      "falsification_conditions": [
        "BOS does not differ from matched raw breaks",
        "structure direction adds no information"
      ],
      "oos_pass_criteria": [
        "stable structural outcomes above matched controls"
      ],
      "existing_binding": "BreakOfStructureState scope=continuation emits QUALIFIED_BOS from the exact RAW_BOUNDARY_BREAK and prior STRUCTURE_DIRECTION_CONFIRMED parents"
    },
    "protected_swing": {
      "owner": "eye",
      "domain_meaning": "The opposite swing at the origin of the break that keeps the current structure valid.",
      "operational_definition": "Bind the opposite structural swing of the most recent same-timeframe BOS origin. Keep it protected until the registered acceptance break criterion completes; wick, close, and acceptance breaks remain distinct observations.",
      "hypothesized_relations": [
        "protected swings may show higher defense and structural-failure relevance than matched swings"
      ],
      "falsification_conditions": [
        "protected and matched same-rank swings have indistinguishable survival and reaction"
      ],
      "oos_pass_criteria": [
        "stable survival, break, and transition relationships"
      ],
      "existing_binding": "a continuation BOS emits PROTECTED_SWING_ASSIGNED from the exact QUALIFIED_BOS, STRUCTURAL_LEG_CREATED, and SWING_CONFIRMED parents; StructureSequenceState.protected_swing_id is the reducer projection"
    },
    "mss_core": {
      "owner": "eye",
      "domain_meaning": "The first opposite internal structural break.",
      "operational_definition": "Emit the first confirmed structural-boundary break opposite the internal direction that existed immediately before the break. Prior sweep, displacement, FVG, and parent location are separate context tags.",
      "hypothesized_relations": [
        "core MSS may alter the next structural-event distribution",
        "sweep, displacement, FVG, and parent location may add separable information"
      ],
      "falsification_conditions": [
        "MSS core does not differ from matched opposite breaks",
        "context additions do not improve outcomes"
      ],
      "oos_pass_criteria": [
        "MSS alone or a preregistered validated composition has stable incremental value"
      ],
      "existing_binding": "an opposed BreakOfStructureState emits MSS_CORE_CONFIRMED from the exact RAW_BOUNDARY_BREAK and prior STRUCTURE_DIRECTION_CONFIRMED parents; Sweep, Displacement, and FVG remain optional context evidence"
    },
    "fvg": {
      "owner": "eye",
      "domain_meaning": "A three-candle non-overlapping price interval.",
      "operational_definition": "Bullish when low[c3] exceeds high[c1] by the registered minimum gap; bearish is symmetric. Confirm at c3 close and freeze source completed-bar events and bounds. Emit distinct created, partially-filled, midpoint-touched, fully-filled/mitigated, and invalidated observations without backfill. The first re-entry into the frozen gap is published once as FVG_FIRST_RETEST, before the revisable fill observation it shares its bar with. It freezes fill_depth_at_entry, age_bars, age_seconds, the entry lifecycle and reason, the formation qualification, the session, the displacement that produced the gap, and approach_speed_atr = the distance still separating the last completed M5 close from the near edge, divided by that entry bar's causal ATR. Partial, mitigated and invalidated all require entry, so the first of them is the first re-entry; the reserved age-based expiry is not an entry and never opens the retest. The Group-3 protocol forbids MBO, so no book evidence is carried. v1.3 has no age-based expiry threshold: FVG_EXPIRED is reserved for a future explicitly registered upstream lifecycle fact and is not in the production-emitted population. v1.3 additionally registers FIRST_RETEST_EVENT: after creation price must leave the gap entirely, and the first later geometric overlap with the frozen bounds is the first retest. It is emitted once per gap and freezes fill_depth_at_entry, age_bars, approach_speed, parent state, session, and the displacement ancestry that created the gap. Whether that retest continued or invalidated is a later observation and is not part of the retest fact.",
      "hypothesized_relations": [
        "gap size, source displacement, and first-retracement depth may condition continuation"
      ],
      "falsification_conditions": [
        "FVG reactions do not differ from matched random zones"
      ],
      "oos_pass_criteria": [
        "stable value after trend, volatility, session, size, and distance controls"
      ],
      "existing_binding": "CausalZoneTracker / FairValueGapState emits FVG_CREATED, FVG_PARTIALLY_FILLED, FVG_MIDPOINT_TOUCHED, FVG_FULLY_FILLED, and FVG_INVALIDATED; FVG_FIRST_RETEST is emitted once per gap, FVG_TOUCHED is a compatibility alias not emitted by v1.3, and FVG_EXPIRED is reserved/not emitted"
    },
    "base_origin_core": {
      "owner": "eye",
      "domain_meaning": "The geometry of the last opposite-direction candle or cluster before an impulse. Pure geometry: it makes no claim that the impulse mattered.",
      "operational_definition": "Freeze the configured geometry of the last opposite candle or opposite-candle cluster preceding a directional impulse, with the exact impulse identity that located it. A base origin core exists whether or not the impulse went on to displace or to break structure, and it is never treated as an independent causal agent. It carries no order-block interpretation; that reading belongs to the Brain.",
      "hypothesized_relations": [
        "impulse origin geometry may condition later reaction"
      ],
      "falsification_conditions": [
        "origin geometry adds nothing once the impulse itself is known"
      ],
      "oos_pass_criteria": [
        "exact replay of frozen geometry from the cited impulse alone"
      ],
      "existing_binding": "CausalZoneTracker / OrderBlockState emits ORIGIN_ZONE_CREATED, ORIGIN_ZONE_MITIGATED, and ORIGIN_ZONE_INVALIDATED from exact Displacement, raw-break, and anchor-bar ancestry; ORIGIN_ZONE_TOUCHED is a compatibility alias not emitted in v1.3 and ORDER_BLOCK_STATE is legacy lifecycle transport; BASE_ORIGIN_CORE_CREATED carries the frozen geometry and the impulse identity only; ORIGIN_ZONE_CREATED is retired to a compatibility alias and is not emitted."
    },
    "qualified_origin_zone": {
      "owner": "eye",
      "domain_meaning": "A base origin core that an active displacement and a qualified BOS have since promoted. It records the qualification, not a trade thesis.",
      "operational_definition": "Bind exactly one base_origin_core, the active DISPLACEMENT_OBSERVED episode, and the QUALIFIED_BOS that together qualify it, keeping all three source identities. Qualification is append-only and never backdated into the base origin core, which remains readable on its own. Whether a qualified origin zone is tradable is a Brain interpretation and is not registered here.",
      "hypothesized_relations": [
        "displacement and BOS qualification may separate reactive origins from inert ones"
      ],
      "falsification_conditions": [
        "qualified zones behave no differently from unqualified base cores"
      ],
      "oos_pass_criteria": [
        "qualification is reproducible from its three frozen sources and separates outcomes"
      ],
      "existing_binding": "CausalZoneTracker / OrderBlockState emits ORIGIN_ZONE_CREATED, ORIGIN_ZONE_MITIGATED, and ORIGIN_ZONE_INVALIDATED from exact Displacement, raw-break, and anchor-bar ancestry; ORIGIN_ZONE_TOUCHED is a compatibility alias not emitted in v1.3 and ORDER_BLOCK_STATE is legacy lifecycle transport; QUALIFIED_ORIGIN_ZONE_CREATED is emitted at the same clock, immediately after the core it binds, and the origin-zone terminals cite it rather than the retired ORIGIN_ZONE_CREATED."
    },
    "structural_range": {
      "owner": "eye",
      "domain_meaning": "The external interval whose frozen boundaries locate current price. It answers \"where are we\", and nothing about how price behaved inside.",
      "operational_definition": "Create from a frozen valid pair of opposite structural anchors and retain source identities and geometry. A structural range is usable for location the moment it is created: it carries lower_bound, upper_bound, normalized_location = (price - low) / (high - low), the Premium/Discount label derived from that value, and same-timeframe IRL/ERL membership. It has no maturity condition and no two-sided test requirement, because location does not depend on how price behaved inside the interval. Four production-reachable invalidation variants remain distinct under DEALING_RANGE_INVALIDATED: three forming variants identified separately by transition_reason (close_beyond_frozen_range_before_activation, forming_source_invalidated, maturity_deadline_elapsed) and one active_acceptance variant that additionally requires DEALING_RANGE_ACTIVATED, the completed H1 break BAR, and ACCEPTANCE_CONFIRMED with transition_reason=close_beyond_frozen_range. For the active variant, external acceptance is exactly the first completed H1 close strictly outside a frozen boundary; a wick outside with an H1 close inside does not qualify, and no M-bar hold is claimed. DEALING_RANGE_EXTENDED is reserved and is not emitted. A later explicit replacement may follow invalidation; never reselect an advantageous range on every bar.",
      "hypothesized_relations": [
        "normalized location may condition setups and target probabilities"
      ],
      "falsification_conditions": [
        "nearby anchor choices produce unstable location",
        "normalized location adds no information"
      ],
      "oos_pass_criteria": [
        "exact replay and stable conditional structural relationships"
      ],
      "existing_binding": "CausalRangeAuctionTracker / DealingRangeState emits DEALING_RANGE_CREATED, DEALING_RANGE_ACTIVATED, DEALING_RANGE_INVALIDATED, and DEALING_RANGE_REPLACED; invalidations preserve separate forming-close, forming-source-invalidated, forming-maturity-deadline, or active-acceptance variants, while DEALING_RANGE_EXTENDED is reserved/not emitted in v1.3; v1.3 keeps DEALING_RANGE_CREATED, DEALING_RANGE_INVALIDATED and DEALING_RANGE_REPLACED as the location lifecycle and retires DEALING_RANGE_ACTIVATED to a compatibility alias, because activation was a balance claim rather than a location one"
    },
    "balance_range": {
      "owner": "eye",
      "domain_meaning": "Evidence that price actually two-sided-tested an interval rather than merely occupying it. It answers \"was this balance\", and says nothing about location.",
      "operational_definition": "Observed over a structural range that already exists. A balance range records two-sided boundary tests, midpoint crossings, inside close fraction and compression, and reaches MATURE only when the registered maturity conditions hold together at one completed H1 close. Failure to mature never invalidates the underlying structural range: location survives, only the balance claim lapses.",
      "hypothesized_relations": [
        "two-sided tested balance may behave differently from mere occupation"
      ],
      "falsification_conditions": [
        "maturity is unreachable in production data, as it was throughout v1.2",
        "matured balance is indistinguishable from an untested structural range"
      ],
      "oos_pass_criteria": [
