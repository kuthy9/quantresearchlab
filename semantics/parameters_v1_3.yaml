    "balance_range_bilateral_price_tests_each": {
      "value": 2,
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_range.json:engineering_parameters.balance_minimum_price_test_generations_each",
      "sub_protocol_version": "balance_range_v1.2",
      "threshold_semantics": "the registered two-sided standard: BALANCE_RANGE_OBSERVED is published once price has made this many distinct test generations against each frozen boundary, independently of the remaining maturity conditions. A generation is one continuous visit to the boundary's tolerance band -- price must leave the band before the next can open -- so a run of bars hugging one level counts once. balance_range_v1.2 moved this off the source zone's structural touch count, which only increments when another confirmed swing forms inside the zone: over 2022-02, 17 of 18 H1 zones therefore stayed at one touch for life and the standard was unreachable in principle rather than merely rare. The value is unchanged at 2; only the evidence it counts is different."
    },
    "balance_range_price_test_band": {
      "values": {
        "band_atr_fraction": 0.25,
        "band_minimum_ticks": 1,
        "deep_penetration_atr_fraction": 0.25
      },
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_range.json:engineering_parameters",
      "sub_protocol_version": "balance_range_v1.2",
      "threshold_semantics": "the tolerance around a frozen boundary within which a completed H1 bar counts as testing it: max(band_minimum_ticks * tick_size, band_atr_fraction * the ATR known before that bar). A test is classified touch_only, shallow_penetration, deep_penetration or close_outside, escalating within one generation; deep_penetration begins deep_penetration_atr_fraction of that prior ATR beyond the boundary. close_outside remains the range's own invalidation and is not a second concept."
    },
    "swing_hierarchy_hot_retention": {
      "value": 2048,
      "status": "frozen_bounded_working_set",
      "source": "smc_trader.market_state.SWING_HIERARCHY_HOT_RETENTION",
      "threshold_semantics": "how many confirmed Swings one timeframe keeps in reduced state; the immutable event stream owns the complete role history, exactly as it does for structural_legs. Two reads can still reach an older Swing and both were measured over 2022-02: a later rank assignment reached at most 4 Swings back on its own timeframe, and the geometry tree's retroactive adoption at most 447, bounded by the span of the largest enabled timeframe's confirmation window rather than by elapsed bars. The window carries a wide margin over both, so eviction only ever drops Swings that nothing reads"
    },
    "interaction_hold_bars": {
      "value": 1,
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_interaction.json:engineering_parameters.later_hold_bars",
      "threshold_semantics": "the completed later-bar hold a reacceptance must survive before the physical interaction path records reacceptance_held; registering it also binds the interaction protocol's SHA-256 into the atomic definition identity, so its thresholds cannot move without a new semantic version"
    },
    "interaction_context_capacity": {
      "values": {
        "maximum_context_states": 256,
        "maximum_steps_per_path": 16,
        "terminal_context_retention_real_1m_bars": 1
      },
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_interaction.json:engineering_parameters",
      "threshold_semantics": "bounded retention for physical interaction contexts and the steps inside one path; exhaustion fails the update closed rather than evicting a live context. A closed or censored path is exposed in terminal_context_retention_real_1m_bars completed outputs, counting the one that closed it, and is then compacted from the update; its closing transition was delivered on that bar and the fact stays in the event log, so retention changes what the update repeats, not what the Eye states"
    },
    "candidate_retirement": {
      "values": {
        "candidate_retirement_max_native_age_bars": 480,
        "candidate_retirement_max_distance_atr": 20.0
      },
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_structure_liquidity.json:liquidity_parameters",
      "threshold_semantics": "a candidate level retires past 480 bars of its own scale (8 h on 1m, 40 h on 5m, five sessions on 15m) or beyond 20 of its scale's ATRs; the collection is bounded instead of append-only, and a retired identity that re-forms is a new candidate"
    },
    "terminal_state_retention": {
      "values": {
        "terminal_state_retention_native_bars": 1
      },
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_structure_liquidity.json:liquidity_parameters",
      "threshold_semantics": "a reaccepted or retired support/resistance zone and an accepted or rejected equal pool stay in the tracker's snapshot for one completed native bar, the one that made them terminal, and are then compacted; the terminal transition is delivered on that bar and the event log owns the fact, so retention changes what the snapshot repeats, not what the Eye states. A zone a live pool or a live completed-period source still cites is kept regardless, and retained_zones / retained_pools remain the capacity that live state may not exhaust"
    },
    "consumed_item_retention": {
      "values": {
        "consumed_item_retention_native_bars": 1
      },
      "status": "frozen_existing_protocol",
      "source": "configs/primitives_structure_liquidity.json:liquidity_parameters",
      "threshold_semantics": "a consumed swing inventory item stays in the observation for one bar of its own scale, counting the bar of consumption (one 1m observation on 1m, five on 5m), then is dropped; LEVEL_TOUCHED / LEVEL_REACHED delivered the consumption and the event log owns it. The reducer's swept candidate is not retired by this rule: it keeps its disarm / re-arm lifecycle and leaves by candidate_retirement, so unswept_* and the candidate views are unchanged"
    }
