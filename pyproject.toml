[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-continuous-trader"
version = "1.0.0"
description = "Causal multitimeframe SMC observation, belief, decision, and risk engine"
requires-python = ">=3.10"
dependencies = [
  # numpy 2.5 deprecated the unitless ("generic") timedelta64, and pandas 2.3.3 —
  # the newest pandas 2.x — still builds one inside Timedelta.__new__, so every
  # pd.Timedelta(minutes=...) call raises a DeprecationWarning attributed to the
  # caller. Lift this ceiling once a pandas release stops constructing it.
  "numpy>=1.24,<2.5",
  "pandas>=2.0,<3.0",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "exchange-calendars==4.11",
  "psutil>=5.9",
  # scikit-learn and scipy left with the kNN Brain on 2026-09-16.
  # brain/core/llm_client.py verifies DeepSeek's TLS certificate against
  # certifi's bundle: python.org's macOS builds ship without one.
  "certifi>=2024",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dbn = ["databento>=0.64"]

[tool.setuptools.packages.find]
include = ["eyes*", "brain*", "execution*", "shares*", "contract*"]

[tool.pytest.ini_options]
testpaths = ["eyes/tests", "brain/tests", "execution/tests", "shares/tests"]
addopts = "-q --ignore-glob=\"* [0-9].py\" -m 'not research_orchestration'"
markers = [
  "research_orchestration: minutes-long tests on the materialized tape, run separately from the daily suite; currently the real-tape Eye-to-Brain link",
]
